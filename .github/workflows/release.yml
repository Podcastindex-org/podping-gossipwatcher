name: CI/CD - podping-gossipwatcher

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # PHASE 0: Determine Version Context
  # ==========================================
  prepare:
    name: Determine Version Context
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.VERSION }}
      is_release: ${{ steps.get_version.outputs.IS_RELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            PARSED_VERSION=$(grep '^version' podping-gossipwatcher/Cargo.toml | head -1 | cut -d '"' -f 2)
            echo "VERSION=v${PARSED_VERSION}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
            echo "Building main. Extracted version: v${PARSED_VERSION}"

          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
            echo "Building from tag: ${{ github.ref_name }}"

          else
            echo "VERSION=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
            echo "Development build."
          fi

  # ==========================================
  # PHASE 1: Build & Upload Binary Artifacts
  # ==========================================
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_path: target/x86_64-unknown-linux-gnu/release/podping-gossipwatcher
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_path: target/aarch64-unknown-linux-gnu/release/podping-gossipwatcher
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            bin_path: target/armv7-unknown-linux-gnueabihf/release/podping-gossipwatcher
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_path: target/x86_64-apple-darwin/release/podping-gossipwatcher
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_path: target/aarch64-apple-darwin/release/podping-gossipwatcher

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compile)
        if: contains(matrix.os, 'ubuntu')
        run: cargo install cross --locked

      - name: Build (Linux via cross)
        if: contains(matrix.os, 'ubuntu')
        run: cross build --release --locked -p podping-gossipwatcher --target ${{ matrix.target }}

      - name: Build (macOS native)
        if: contains(matrix.os, 'ubuntu') == false
        run: cargo build --release --locked -p podping-gossipwatcher --target ${{ matrix.target }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-binary
          path: ${{ matrix.bin_path }}
          retention-days: 1

  # ==========================================
  # PHASE 2: Package & Publish GitHub Release
  # ==========================================
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package Binaries & Generate Checksums
        run: |
          mkdir -p dist
          TAG_NAME="${{ needs.prepare.outputs.app_version }}"

          package_tar() {
            local target=$1
            local os_arch=$2
            local bin_path="artifacts/${target}-binary/podping-gossipwatcher"
            local archive_name="podping-gossipwatcher-${TAG_NAME}-${os_arch}.tar.gz"

            chmod +x "$bin_path"
            tar -czf "dist/${archive_name}" -C "artifacts/${target}-binary" podping-gossipwatcher
            cd dist && shasum -a 256 "${archive_name}" > "${archive_name}.sha256" && cd ..
          }

          package_tar "x86_64-unknown-linux-gnu" "linux-x86_64"
          package_tar "aarch64-unknown-linux-gnu" "linux-aarch64"
          package_tar "armv7-unknown-linux-gnueabihf" "linux-armv7"
          package_tar "x86_64-apple-darwin" "macos-x86_64"
          package_tar "aarch64-apple-darwin" "macos-aarch64"

      - name: Create Release and Upload Assets
        run: |
          gh release create "${{ needs.prepare.outputs.app_version }}" dist/* \
            -R "${{ github.repository }}" \
            --title "Release ${{ needs.prepare.outputs.app_version }}" \
            --target "${{ github.sha }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # PHASE 3: Build & Push Docker Image
  # ==========================================
  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary artifacts (Linux only)
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine registries
        id: registries
        run: |
          IMAGES="ghcr.io/${{ github.repository_owner }}/podping-gossipwatcher"
          HAS_DOCKERHUB="false"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            IMAGES="$IMAGES,docker.io/podcastindexorg/podping-gossipwatcher"
            HAS_DOCKERHUB="true"
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "has_dockerhub=$HAS_DOCKERHUB" >> $GITHUB_OUTPUT
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.prepare.outputs.app_version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
